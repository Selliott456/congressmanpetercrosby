<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
		<link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#091B36" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&family=Inter:wght@300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
			Google Tag Manager's no-JS fallback. The container's <script> half is loaded from
			src/lib/analytics.ts instead of here, so it can be held back in dev and on deploy
			previews; this iframe cannot be gated the same way, but it only ever runs for a
			visitor with JavaScript disabled, who in an SPA sees a single page and no
			navigation. Keep the container id in sync with GTM_CONTAINER_ID.
		-->
		<noscript
			><iframe
				src="https://www.googletagmanager.com/ns.html?id=GTM-K6R427Q3"
				height="0"
				width="0"
				style="display:none;visibility:hidden"
				title="Google Tag Manager"
			></iframe
		></noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
