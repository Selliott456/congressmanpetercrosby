<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Netlify Form Detection</title>
	</head>
	<body>
		<!--
			Static fallback form so Netlify can detect form schema at build time.
			This page does not need to be linked in navigation.
		-->
		<form name="contact" method="POST" action="/netlify-form-detection.html" data-netlify="true" hidden>
			<input type="hidden" name="form-name" value="contact" />
			<input type="hidden" name="redirect" value="/contact-success" />
			<input type="text" name="firstName" />
			<input type="text" name="lastName" />
			<input type="email" name="email" />
			<textarea name="message"></textarea>
			<input type="text" name="topic" />
		</form>
	</body>
</html>
