<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Netlify Form Detection</title>
	</head>
	<body>
		<!--
			Static fallback form so Netlify can detect form schema at build time.
			This page does not need to be linked in navigation.
		-->
		<form
			name="contact"
			method="POST"
			action="/volunteer"
			data-netlify="true"
			netlify-honeypot="bot-field"
			hidden
		>
			<input type="hidden" name="form-name" value="contact" />
			<input type="text" name="bot-field" />
			<input type="text" name="firstName" />
			<input type="text" name="lastName" />
			<input type="email" name="email" />
			<input type="tel" name="phone" />
			<input type="text" name="zip" />
			<textarea name="message"></textarea>
			<input type="text" name="topic" />
			<input type="checkbox" name="help_canvassing" value="yes" />
			<input type="checkbox" name="help_phone_banking" value="yes" />
			<input type="checkbox" name="help_text_banking" value="yes" />
			<input type="checkbox" name="help_hosting_event" value="yes" />
			<input type="checkbox" name="help_data_entry" value="yes" />
			<input type="checkbox" name="help_wherever_needed" value="yes" />
		</form>
	</body>
</html>
