# Netlify configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

# Long cache for /images (swap filenames or bump deploy when replacing assets)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Always revalidate HTML so clients pick up the latest hashed JS chunk map.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Bluesky handle verification (static/.well-known/atproto-did). The file has no
# extension, so pin the type — otherwise it is served as a download rather than
# text, and the verifier reads an empty body. Content is the bare DID, no `did=`
# prefix: that prefix belongs to the DNS TXT method, not this one.
[[headers]]
  for = "/.well-known/atproto-did"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Redirects (e.g. for petercrosbyforcongress.org)
[[redirects]]
  from = "/donate"
  to = "https://secure.actblue.com/donate/peter-crosby-1"
  status = 301
  force = true

[[redirects]]
  from = "/take-action"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/images/brand_strategy_logo_white.svg"
  status = 301
  force = true

# The Data Room moved from /analytics (Sep 2026). Keep demo links and bookmarks working.
[[redirects]]
  from = "/analytics"
  to = "/data-room"
  status = 301
  force = true

[[redirects]]
  from = "/analytics/*"
  to = "/data-room/:splat"
  status = 301
  force = true

# /past-interviews was retired (Sep 2026); its interviews live in Media Coverage on /media.
[[redirects]]
  from = "/past-interviews"
  to = "/media#coverage"
  status = 301
  force = true
